  document.getElementById("langBtn").textContent=english?"中文":"EN";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key=el.dataset.i18n;
    if(english && translations.en[key]) el.textContent=translations.en[key];
    else el.textContent=el.dataset.zh || (el.dataset.zh=el.textContent);
  });
});
document.getElementById("year").textContent=new Date().getFullYear();
</script>
</body>
</html>
'''

workflow = r'''name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
'''
readme = """# Personal Portfolio｜個人履歷與作品集

這是一個可直接部署到 GitHub Pages 的純 HTML/CSS/JavaScript 個人網站。

## 部署前請先修改
1. 在 `index.html` 搜尋 `YOUR_EMAIL@example.com`，換成求職用 Email。
2. 核對學歷、工作經歷、技能及專案內容，尤其是目前職稱與任職起訖日期。
3. 若要放 PDF 履歷，將檔案放入 `assets/documents/`，再新增下載連結。

## GitHub Pages 部署
1. 將本專案所有檔案上傳至已建立的 Repository 根目錄。
2. 確認 `.github/workflows/static.yml` 路徑與檔名正確。
3. 開啟 Repository → Settings → Pages。
4. Build and deployment 的 Source 選擇 **GitHub Actions**。
5. 到 Actions 分頁確認 `Deploy Portfolio to GitHub Pages` 執行成功。
6. 成功後可在 Settings → Pages 查看公開網址。

## 更新網站
修改 `index.html` 或其他網站檔案後，Commit changes 到 `main`，GitHub Actions 會自動重新部署。

## 隱私提醒
這是公開網站。不要放身分證字號、完整住址、私人電話、員工編號、未公開論文原始資料、前公司內部文件或未經授權的照片。
"""
(root / "index.html").write_text(html, encoding="utf-8")
(root / ".github" / "workflows" / "static.yml").write_text(workflow, encoding="utf-8")
(root / "README.md").write_text(readme, encoding="utf-8")
zip_path = Path("/mnt/data/personal_portfolio_github_pages.zip")
with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as z:
    for p in root.rglob("*"):
        if p.is_file():
            z.write(p, Path("personal-portfolio") / p.relative_to(root))
print("Created", zip_path)
print("Files:", [str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()])
